name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            formats: dmg
          - os: macos-15-intel
            formats: dmg
          - os: windows-latest
            formats: nsis
          - os: ubuntu-22.04
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo install cargo-packager --locked
      - run: cargo build --release -p emuzip-app
      - run: cargo packager --release -p emuzip-app --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: emuzip-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/release/*.dmg
            target/release/*.msi
            target/release/*-setup.exe
            target/release/*.deb
            target/release/*.AppImage

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
