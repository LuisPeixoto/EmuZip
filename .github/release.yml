changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: "✨ New features"
      labels: [enhancement, feature]
    - title: "🐛 Bug fixes"
      labels: [bug]
    - title: "🌍 Translations"
      labels: [i18n, translation]
    - title: "📚 Documentation"
      labels: [documentation]
    - title: "🧰 Maintenance"
      labels: [chore, ci, dependencies, refactor]
    - title: "Other changes"
      labels: ["*"]
