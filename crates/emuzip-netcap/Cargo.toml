[package]
name = "emuzip-netcap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MITM proxy and traffic exporters (HAR, Postman, cURL)"
publish = false

[dependencies]
anyhow.workspace = true
hudsucker = { version = "0.25", default-features = false, features = ["decoder", "rcgen-ca", "rustls-client"] }
http-body-util = "0.1"
x509-parser = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
base64 = "0.23"
